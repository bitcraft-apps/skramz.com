version: '3'

dotenv: ['.env']

tasks:
  dev:
    deps: [dev:api, dev:web]

  dev:api:
    dir: api
    cmd: pnpm dev

  dev:web:
    dir: web
    cmd: pnpm dev

  build:api:
    dir: api
    cmd: pnpm build

  build:web:
    dir: web
    cmd: pnpm build

  test:
    deps: [test:api, test:web, test:cli]

  test:api:
    dir: api
    cmd: pnpm test

  test:web:
    dir: web
    cmd: pnpm vitest run

  test:cli:
    dir: cli-agent
    cmd: go test ./...

  migrate:
    desc: Apply D1 migrations locally
    dir: api
    cmd: pnpm exec wrangler d1 migrations apply DB --local

  seed:
    desc: Apply one seed file to local D1, e.g. `task seed SEED=yaphet-kotto.sql` (explicit only; seeds never run via migrate)
    dir: api
    cmd: 'pnpm exec wrangler d1 execute DB --local --file seeds/{{.SEED}}'

  migrate:prod:
    desc: Apply D1 migrations to production (explicit only)
    dir: api
    cmd: pnpm exec wrangler d1 migrations apply DB --remote

  verify:remote-cascade:
    desc: Verify FK/ON DELETE CASCADE on remote D1 (issue #23; needs Cloudflare auth env)
    dir: api
    cmd: ./scripts/verify-fk-cascade.sh --remote

  scrape:
    desc: Run ingestion CLI (preview only unless confirmed with [Y/n])
    dir: cli-agent
    cmd: 'go run ./cmd/cli-agent scrape {{.CLI_ARGS}}'
