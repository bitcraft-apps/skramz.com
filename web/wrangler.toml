# skramz.org frontend (Vite SPA on Workers Static Assets, ADR-0004).
# Build output is dist/ (not the Next.js out/); the SPA fallback serves
# index.html for client-side routes. No Worker entry: this is an
# assets-only Worker. Real IDs live in GitHub secrets — never in git.

name = "skramz-web"
compatibility_date = "2026-10-01"

# PR previews ride the free workers.dev URL (no second environment),
# same staging pattern as the API Worker (ADR-0001 precedent).
workers_dev = true

# Production: skramz.org + www on the skramz.org zone (Cloudflare
# Registrar, bought 2026-10-13). Deploy creates the DNS records
# automatically; the zone must be in the same account.
# See infra/domains.md. Cutover detaches these hosts from the
# skramz-web Pages project first (issue #55).
routes = [
  { pattern = "skramz.org", custom_domain = true },
  { pattern = "www.skramz.org", custom_domain = true },
]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
